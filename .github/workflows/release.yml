name: Release apps

# Builds the downloadable apps when a version tag is pushed (e.g. v0.2.0),
# and attaches them to the GitHub Release. Can also be run by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            artifact: HomeStream-macOS.zip
          - os: windows-latest
            artifact: HomeStream-Windows.zip
          - os: ubuntu-latest
            artifact: HomeStream-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Linux libraries for the tray icon
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0 libgirepository-2.0-dev gir1.2-ayatanaappindicator3-0.1
      - name: Install HomeStream and PyInstaller
        run: pip install -e ".[tray]" pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/homestream.spec
      - name: Smoke test (the packaged app starts and answers)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) APP=dist/HomeStream.app/Contents/MacOS/HomeStream ;;
            Windows) APP=dist/HomeStream/HomeStream.exe ;;
            *) APP=dist/HomeStream/HomeStream ;;
          esac
          export HOMESTREAM_ENV_FILE="$RUNNER_TEMP/test.env" HOMESTREAM_TOKEN=ci-smoke-test-token-0123 \
                 HOMESTREAM_AUDIO_DEVICE=test-tone HOMESTREAM_PLAYER=dryrun HOMESTREAM_HOST=127.0.0.1
          "$APP" serve & PID=$!
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          curl -sf -H "Authorization: Bearer $HOMESTREAM_TOKEN" http://127.0.0.1:8765/status
          curl -sf -m 3 -H "Authorization: Bearer $HOMESTREAM_TOKEN" http://127.0.0.1:8765/stream.mp3 -o s.mp3 || true
          test -s s.mp3
          kill $PID || true
      - name: Package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) ditto -c -k --keepParent dist/HomeStream.app "${{ matrix.artifact }}" ;;
            Windows) 7z a "${{ matrix.artifact }}" ./dist/HomeStream ;;
            *) tar -C dist -czf "${{ matrix.artifact }}" HomeStream ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" HomeStream-* --repo "$GITHUB_REPOSITORY" --generate-notes || gh release upload "$GITHUB_REF_NAME" HomeStream-* --repo "$GITHUB_REPOSITORY" --clobber
