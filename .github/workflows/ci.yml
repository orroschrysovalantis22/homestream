name: CI

on:
  push:
  pull_request:

permissions:
  contents: read  # tests and lint only read the code

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HomeStream
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck setup.sh scripts/*.sh tools/*.sh tools/linux/*.sh
      - name: Lint Python (errors only)
        run: pipx run ruff check --select E9,F homestream tests tools

  linux-end-to-end:
    # A real player (mpv) plays to PulseAudio; HomeStream streams and controls it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tools/linux/test.sh
        run: tools/linux/test.sh
