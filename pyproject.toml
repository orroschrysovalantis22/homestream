[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homestream"
version = "0.2.1"
description = "Listen to whatever your computer is playing from your phone, anywhere, and control it."
readme = "README.md"
license = "MIT"
authors = [{ name = "Orros Chrysovalantis" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "lameenc>=1.7",
    "qrcode>=7.4",
    # macOS: capture BlackHole via PortAudio; Now Playing / Spotify / media keys
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    # Windows and Linux: record what the speakers play (WASAPI loopback / PulseAudio monitor)
    "soundcard>=0.4.3; sys_platform != 'darwin'",
    "numpy>=1.26; sys_platform != 'darwin'",
    # Windows: the system media controls
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10"]
dev = ["pytest>=8", "numpy>=1.26", "ruff>=0.6"]

[project.scripts]
homestream = "homestream.cli:main"

[project.urls]
Homepage = "https://github.com/orroschrysovalantis22/homestream"

[tool.setuptools.packages.find]
include = ["homestream*"]

[tool.setuptools.package-data]
homestream = ["web/*.html", "web/static/*", "web/static/tray/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
